name: Skill Validation

on:
  # Pushes are validated too, not just PRs. The admin pipeline pushes straight
  # to master with branch-protection bypass, so a PR-only trigger meant the
  # validator never ran on the path that produces most changes: eight skills
  # were found live and over the 5,000-word cap, and this workflow had no runs
  # at all while master kept receiving commits.
  push:
    branches: [master]
    paths:
      - '**/SKILL.md'
      - '**/SKILL_HE.md'
      - '**/metadata.json'
      - '**/evidence.json'
      - '**/*.py'
      - '**/*.sh'
      - '**/*.js'
      - '**/*.ts'
  pull_request:
    branches: [master]
    paths:
      - '**/SKILL.md'
      - '**/SKILL_HE.md'
      - '**/metadata.json'
      - '**/evidence.json'
      - '**/*.py'
      - '**/*.sh'
      - '**/*.js'
      - '**/*.ts'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find changed skill files
        id: changed
        run: |
          # ALL is every changed path this event touched; FILES narrows it to
          # SKILL.md. Both are derived from the same diff so the evidence gate
          # below works on push as well as on pull_request -- it used to call
          # `gh pr diff` unconditionally, which on a push to master resolved to
          # "no pull requests found", swallowed the error via `|| true`, and
          # silently enforced nothing on the branch that gets most commits.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ALL=$(gh pr diff ${{ github.event.pull_request.number }} --name-only)
          else
            BEFORE="${{ github.event.before }}"
            # A new branch or a force-push reports an all-zero "before" sha;
            # fall back to the previous commit so the step still validates.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE=$(git rev-parse HEAD~1 2>/dev/null || echo "")
            fi
            if [ -n "$BEFORE" ]; then
              ALL=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            else
              ALL=""
            fi
          fi
          FILES=$(printf '%s\n' "$ALL" | grep 'SKILL.md$' || true)
          DIRS=$(printf '%s\n' "$ALL" \
            | grep -oE '^[^/]+/' \
            | sort -u \
            | sed 's:/$::' \
            | grep -vE '^(\.github|scripts|\.|docs)$' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "dirs<<EOF" >> $GITHUB_OUTPUT
          echo "$DIRS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate SKILL.md files
        if: steps.changed.outputs.files != ''
        run: |
          chmod +x scripts/validate-skill.sh
          # `files` is a NEWLINE-separated list. Interpolating it directly into the
          # command line meant that with 2+ changed skills every line after the first
          # was executed as its own command ("Permission denied", exit 126), so the
          # second and later skills in a batch push were never validated at all.
          # Feed it through xargs so all paths land as arguments to one invocation.
          printf '%s\n' "${{ steps.changed.outputs.files }}" \
            | sed '/^$/d' \
            | xargs -r ./scripts/validate-skill.sh

      - name: Check evidence.json present for touched skill folders
        if: steps.changed.outputs.files != ''
        run: |
          # Forward-only enforcement: any skill folder touched in this change must
          # contain evidence.json. Skills not touched here are exempt
          # (lazy backfill: they pick up the gate on their next update).
          # See /he/guides/how-we-validate Layer 2 + .claude/skills/update-skill/SKILL.md.
          set -e
          MISSING=""
          # `dirs` is newline-separated and Actions pastes it into the script SOURCE,
          # so inlining it here made `for dir in a<newline>b; do` a bash SYNTAX ERROR
          # (exit 2) whenever a push touched 2+ skills, silently skipping this gate on
          # exactly the pushes most likely to need it. Assign first, then word-split at
          # runtime via an unquoted expansion.
          DIRS="${{ steps.changed.outputs.dirs }}"
          for dir in $DIRS; do
            if [ -f "$dir/SKILL.md" ] && [ ! -f "$dir/evidence.json" ]; then
              MISSING="$MISSING\n  - $dir/evidence.json"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Touched skill folders are missing evidence.json:"
            printf "%b\n" "$MISSING"
            echo ""
            echo "Every change that touches a skill folder must include evidence.json."
            echo "Build it via the update-skill or skills-il-admin-creator admin workflow."
            echo "See: https://agentskills.co.il/he/guides/how-we-validate"
            exit 1
          fi

      - name: Post validation results
        # Only pull_request events have somewhere to post a comment. On a push
        # to master `gh pr comment` gets an empty PR number, resolves the branch,
        # and exits 1 with "no pull requests found for branch master" -- which
        # failed the whole job even though validation itself had passed.
        if: always() && github.event_name == 'pull_request' && steps.changed.outputs.files != ''
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body "## Skill Validation Passed

          All SKILL.md files are valid and touched skill folders carry evidence.json."
          else
            gh pr comment ${{ github.event.pull_request.number }} --body "## Skill Validation Failed

          Please check the workflow logs for details. See [CONTRIBUTING.md](https://github.com/skills-il/.github/blob/main/CONTRIBUTING.md) for the full spec."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
